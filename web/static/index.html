<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pay Logger</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e2125'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%233ec291' font-family='Arial' font-weight='bold'>$</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div>
        <h1>Pay Logger</h1>
        <div id="subtitle" class="muted"></div>
        <div id="greeting" class="holiday" hidden></div>
      </div>
      <button id="refresh" class="ghost" title="Refresh">↻</button>
    </header>

    <div id="missed" class="banner" hidden></div>
    <div id="toast" class="toast" hidden></div>

    <main id="views"></main>

    <nav id="tabbar">
      <button data-view="home" class="active"><span>▦</span>Home</button>
      <button data-view="add"><span>＋</span>Add</button>
      <button data-view="logs"><span>▤</span>Logs</button>
      <button data-view="insights"><span>◔</span>Stats</button>
      <button data-view="more"><span>⋯</span>More</button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
